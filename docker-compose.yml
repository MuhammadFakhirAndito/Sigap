services:
  postgres:
    image: postgres:16-alpine
    container_name: sigap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigap
      POSTGRES_PASSWORD: sigap_password
      POSTGRES_DB: sigap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigap -d sigap"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigap_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://sigap:sigap_password@postgres:5432/sigap?schema=public
      - SYNC_SECRET=${SYNC_SECRET}
      - LOG_HMAC_SECRET=${LOG_HMAC_SECRET}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
