name: sigap-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigap_postgres_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-pgadmin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD wajib diisi di .env}
      POSTGRES_DB: postgres
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD wajib diisi di .env}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sigap_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigap -d sigap"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigap_app_prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PUBLISH_BIND:-127.0.0.1:3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://sigap:${POSTGRES_APP_PASSWORD}@postgres:5432/sigap?schema=public
    networks:
      - sigap_internal
      - sigap_egress
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.status===200||r.status===503?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  sigap_internal:
    driver: bridge
    internal: true
  sigap_egress:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
